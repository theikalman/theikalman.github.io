---
layout: default
---

<article class="post-entry" itemscope itemtype="http://schema.org/BlogPosting">

    <header class="post-header">
        <p class="post-kicker"><a href="/photography">photos</a> <span aria-hidden="true">/</span></p>
        <h1 class="post-title" itemprop="headline">{{ page.title }}</h1>
        <div class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time>
            {%- if page.author %}
            <span class="post-meta-sep" aria-hidden="true">&middot;</span>
            <span itemprop="author">{{ page.author }}</span>
            {%- endif %}
        </div>
    </header>

    <div class="post-content" itemprop="articleBody">
        {{ content }}
    </div>

    <footer class="post-footer">
        <a href="/photography">&larr; all photos</a>
        <a href="#content">top &uarr;</a>
    </footer>

    <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
