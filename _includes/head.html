<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="Jekyll">
    <link rel="license" href="LICENSE">

    <meta name="application-name" content="{{ site.title }}">
    <meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
    <link rel="archives" href="{{site.url}}/archives/">

    <meta name="robots" content="index,follow">
    <meta name="googlebot" content="index,follow">

    <script>
        try {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
    <link rel="stylesheet" href="/assets/main.css?v={{ site.time | date: '%s' }}">
    {%- seo -%}
    {%- feed_meta -%}
    <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml">
    <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.ico">
</head>
